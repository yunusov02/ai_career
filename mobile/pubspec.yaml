name: skillbridge
description: "SkillBridge mobile career assessment, learning roadmap, and AI tutor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management — BLoC pattern for predictable, testable state transitions.
  # BLoC enforces unidirectional data flow: Event → Bloc → State → UI.
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking and encrypted session storage.
  dio: ^5.8.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2

  # UI — Premium typography via Google Fonts (Poppins for headings, Inter for body).
  google_fonts: ^6.2.1

  # UI — Beautiful OTP input field with built-in animations and customization.
  pinput: ^5.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
