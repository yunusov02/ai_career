# SkillBridge — Docker Compose Configuration

version: "3.9"

services:
  # Production API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-SkillBridge}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # ── Required secrets — must be set in the shell environment or a .env file
      #    that is NOT committed to source control.
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/career_assessment.db}
      # ── OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      # ── SMS — set SMS_PROVIDER=eskiz and supply credentials for production
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL:-}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD:-}
      - ESKIZ_FROM=${ESKIZ_FROM:-4546}
      # ── CORS — update to your real domain in production
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$}
      # ── Rate limiting
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - skillbridge_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Development service with hot reload
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: skillbridge-api-dev
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-SkillBridge}
      - DEBUG=true
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-key-change-for-prod}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./career_assessment.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - SMS_PROVIDER=console
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - CORS_ORIGIN_REGEX=^https?://(localhost|127\.0\.0\.1)(:\d+)?$
    volumes:
      - .:/app
      - ./logs:/app/logs
    profiles:
      - dev

volumes:
  skillbridge_data:

networks:
  default:
    name: skillbridge-network
